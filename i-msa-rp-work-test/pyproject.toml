[project]
name = "i-msa-rp-work-test"
version = "0.1.0"
description = "Work-test materials for probing LLM robustness on data-handling tasks."
authors = [
    {name = "sq46", email = "squaade@uchicago.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "ipykernel (>=6.29.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
